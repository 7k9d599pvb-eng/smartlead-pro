name: smartlead

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartlead}
      POSTGRES_USER: ${POSTGRES_USER:-smartlead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      target: base
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      target: base
    env_file: .env
    command: ["python", "-m", "smartlead", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: .
      target: base
    env_file: .env
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db_test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: smartlead_test
      POSTGRES_USER: smartlead_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      # Override TEST_DATABASE_URL for passwords that need URL encoding.
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+asyncpg://smartlead_test:${POSTGRES_PASSWORD}@db_test:5432/smartlead_test}
    depends_on:
      db_test:
        condition: service_healthy

volumes:
  postgres_data:
