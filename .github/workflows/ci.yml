name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartlead_test
          POSTGRES_USER: smartlead_test
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartlead_test -d smartlead_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://smartlead_test:ci-test-password@localhost:5432/smartlead_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run full test suite
        run: python -m pytest -q

  docker:
    name: Docker image and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-test-password
      TEST_DATABASE_URL: postgresql+asyncpg://smartlead_test:ci-test-password@db_test:5432/smartlead_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Prepare Compose environment file
        run: cp .env.example .env
      - name: Build production image
        run: docker build --target base --tag smartlead:ci-base .
      - name: Build and run test image with PostgreSQL
        run: docker compose --profile test run --build --rm --no-TTY test
      - name: Stop test services and remove volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
